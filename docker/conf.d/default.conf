## HTTP server.
server {
    listen 80;
    server_tokens off;

    # Dashboard copy is Indonesian and uses non-ASCII (en-dashes in the SEC labels).
    charset utf-8;

    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;

    root /var/www/public;
    index index.html index.htm;

    # The dashboard is one ~1.4MB file with the survey data, Chart.js and the
    # brand logos all inlined; gzip takes that to ~190KB on the wire.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;

    # The HTML *is* the dataset, so a redeploy has to be picked up on the next
    # load rather than served from a stale cache. ETag still gives us cheap 304s.
    add_header Cache-Control "no-cache" always;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location / {
    	try_files $uri $uri/ /index.html?$query_string;
    }
}

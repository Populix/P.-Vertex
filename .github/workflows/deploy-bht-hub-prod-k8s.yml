name: "[Prod] BHT Hub Deployment"

on:
  push:
    branches:
      - master
    paths:
      - "bht-hub/**"
      - "docker/bht-hub.Dockerfile"
      - ".github/workflows/deploy-bht-hub-prod-k8s.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ap-southeast-1
  K8S_NAMESPACE: saas
  # TODO: confirm these three with infra before the first run.
  ECR_REPOSITORY: prod-bht-hub
  K8S_DEPLOYMENT: bht-hub
  K8S_CONTAINER: bht-hub

jobs:
  build:
    environment: prod
    runs-on: ubuntu-latest
    outputs:
      docker_tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: bht-hub/package-lock.json

      - name: Install Dependencies
        working-directory: bht-hub
        run: npm ci

      - name: Lint and Test
        working-directory: bht-hub
        run: |
          npm run lint
          npm run test

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Docker Version
        id: version
        run: |
          echo -n sha-$(git rev-parse --short HEAD) > version.txt
          echo "tag=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and Push Docker Images Deployment
        uses: docker/build-push-action@v4
        with:
          context: .
          file: docker/bht-hub.Dockerfile
          tags: ${{ secrets.ECR_REPO_URL }}/${{ env.ECR_REPOSITORY }}:build-${{ steps.version.outputs.tag }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    environment: prod
    runs-on:
      group: Default
      labels: private-deployer
    needs: [build]
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: bht-hub-deploy
        run: |
          aws eks --region ${{ env.AWS_REGION }} update-kubeconfig --name ${{ secrets.CLUSTER }}
          kubectl -n ${{ env.K8S_NAMESPACE }} set image deployment/${{ env.K8S_DEPLOYMENT }} \
            ${{ env.K8S_CONTAINER }}=${{ secrets.ECR_REPO_URL }}/${{ env.ECR_REPOSITORY }}:build-${{ needs.build.outputs.docker_tag }}

      - name: Wait for rollout
        run: |
          kubectl -n ${{ env.K8S_NAMESPACE }} rollout status deployment/${{ env.K8S_DEPLOYMENT }} --timeout=5m

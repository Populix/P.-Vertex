name: "[Prod] Deployment"

on:
  push:
    branches:
      - master
    paths:
      - "index.html"
      - "dashboard.html"
      - "docker/**"
      - ".dockerignore"
      - ".github/workflows/deploy-prod-k8s.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ap-southeast-1
  K8S_NAMESPACE: saas
  # TODO: confirm these three with infra before the first run.
  ECR_REPOSITORY: prod-vertex-fe
  K8S_DEPLOYMENT: vertex-fe
  K8S_CONTAINER: vertex-fe

jobs:
  build:
    environment: prod
    runs-on: ubuntu-latest
    outputs:
      docker_tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Docker Version
        id: version
        run: |
          echo -n sha-$(git rev-parse --short HEAD) > version.txt
          echo "tag=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and Push Docker Images Deployment
        uses: docker/build-push-action@v4
        with:
          context: .
          file: docker/Dockerfile
          tags: ${{ secrets.ECR_REPO_URL }}:vertex-${{ steps.version.outputs.tag }}
          push: true
          # cache-from: type=gha
          # cache-to: type=gha,mode=max

  deploy:
    environment: prod
    runs-on:
      group: Default
      labels: private-deployer
    needs: [build]
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: vertex-fe-deploy
        run: |
          aws eks --region ${{ env.AWS_REGION }} update-kubeconfig --name ${{ secrets.CLUSTER }}
          kubectl -n ${{ env.K8S_NAMESPACE }} set image deployment/${{ env.K8S_DEPLOYMENT }} \
            ${{ env.K8S_CONTAINER }}=${{ secrets.ECR_REPO_URL }}:vertex-${{ needs.build.outputs.docker_tag }}

      - name: Wait for rollout
        run: |
          kubectl -n ${{ env.K8S_NAMESPACE }} rollout status deployment/${{ env.K8S_DEPLOYMENT }} --timeout=5m
